
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜行管系</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #f4f6fa;
      color: #263449;
    }

    header {
      background: #142b4a;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    nav {
      background: #203d62;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #b9d8ff;
    }

    .container {
      max-width: 850px;
      margin: 45px auto;
      padding: 35px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #142b4a;
      text-align: center;
      margin-bottom: 15px;
    }

    .intro {
      text-align: center;
      color: #66758a;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 6px;
      background: #142b4a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #284d78;
    }

    footer {
      margin-top: 50px;
      padding: 22px;
      text-align: center;
      background: #142b4a;
      color: white;
    }

    @media (max-width: 600px) {
      nav a {
        display: inline-block;
        margin: 7px 10px;
      }

      .container {
        margin: 25px 15px;
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>行管系</h1>
    <p>企業形象網站</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="about.html">關於我們</a>
    <a href="contact.html">聯絡我們</a>
  </nav>

  <main class="container">
    <h2>聯絡我們</h2>
    <p class="intro">
      如果您有任何問題或合作需求，歡迎填寫以下表單，
      我們收到訊息後將盡快與您聯繫。
    </p>

    <form action="https://formsubmit.co/f921219@gmail.com" method="POST">

      <input type="hidden" name="_subject" value="行管系網站收到新的聯絡表單">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

      <label for="name">姓名 *</label>
      <input type="text" id="name" name="姓名" placeholder="請輸入您的姓名" required>

      <label for="phone">聯絡電話 *</label>
      <input type="tel" id="phone" name="電話" placeholder="請輸入您的電話" required>

      <label for="email">電子郵件 *</label>
      <input type="email" id="email" name="Email" placeholder="請輸入您的電子郵件" required>

      <label for="message">聯絡內容 *</label>
      <textarea id="message" name="聯絡內容" placeholder="請輸入您想詢問的內容" required></textarea>

      <button type="submit">送出表單</button>
    </form>
  </main>

  <footer>
    <p>© 2026 行管系企業形象網站｜All Rights Reserved.</p>
  </footer>

</body>
</html>
