
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜創意行銷公司</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h2 {
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .container {
      max-width: 760px;
      margin: 55px auto;
      padding: 35px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      text-align: center;
      color: #172554;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd2dc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px 15px;
        padding: 22px;
      }

      nav a {
        margin-left: 0;
        margin-right: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2>創意行銷 Creative</h2>
    <nav>
      <a href="index.html">首頁</a>
      <a href="about.html">公司介紹</a>
      <a href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main class="container">
    <h1>聯絡我們</h1>
    <p class="intro">
      感謝您對我們的關注！<br>
      請填寫以下資料，我們將盡快與您聯繫。
    </p>

    <form action="https://formsubmit.co/f921219@gmail.com" method="POST">
      <label for="name">姓名</label>
      <input type="text" id="name" name="姓名"
             placeholder="請輸入您的姓名" required>

      <label for="phone">電話</label>
      <input type="tel" id="phone" name="電話"
             placeholder="請輸入您的電話" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="請輸入您的 Email" required>

      <label for="message">聯絡內容</label>
      <textarea id="message" name="聯絡內容"
                placeholder="請輸入您想詢問的內容" required></textarea>

      <button type="submit">送出聯絡表單</button>
    </form>
  </main>

  <footer>
    © 2026 創意行銷 Creative. All Rights Reserved.
  </footer>

</body>
</html>
